<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">A railway platform under a signal gantry</title>
  <desc id="d">Dusk view across railway tracks: a steel signal gantry spans the frame carrying two lit signal heads — one green, one red — above a concrete platform with a yellow safety line and lit platform lamps.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.34" stop-color="#1e2c49"/>
      <stop offset="0.62" stop-color="#46536f"/>
      <stop offset="0.83" stop-color="#7e7084"/>
      <stop offset="1" stop-color="#bb8652"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="1" r="0.75">
      <stop offset="0" stop-color="#e8b070" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e8b070" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dffc0" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#34e27a" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#34e27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb0a2" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ff3b30" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6bd" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#ffcf8a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffcf8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd79a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffd79a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.76">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <rect y="240" width="800" height="140" fill="url(#haze)"/>

  <!-- stars, thinning toward the horizon glow -->
  <g fill="#d3dcef">
    <circle cx="48" cy="42" r="1.3" opacity="0.7"/><circle cx="126" cy="96" r="1" opacity="0.5"/>
    <circle cx="204" cy="30" r="1.2" opacity="0.65"/><circle cx="278" cy="78" r="1" opacity="0.4"/>
    <circle cx="352" cy="54" r="1.3" opacity="0.6"/><circle cx="430" cy="110" r="1" opacity="0.45"/>
    <circle cx="512" cy="34" r="1.1" opacity="0.7"/><circle cx="590" cy="88" r="1.2" opacity="0.5"/>
    <circle cx="664" cy="46" r="1" opacity="0.6"/><circle cx="742" cy="102" r="1.3" opacity="0.55"/>
    <circle cx="90" cy="150" r="1" opacity="0.35"/><circle cx="560" cy="146" r="1" opacity="0.3"/>
  </g>

  <!-- distant skyline, all bottoms on the horizon at y=340 -->
  <g fill="#151d34">
    <rect x="0" y="300" width="70" height="40"/><rect x="60" y="270" width="48" height="70"/>
    <rect x="110" y="310" width="60" height="30"/><rect x="175" y="250" width="40" height="90"/>
    <rect x="215" y="295" width="70" height="45"/><rect x="290" y="265" width="50" height="75"/>
    <rect x="345" y="305" width="66" height="35"/><rect x="415" y="280" width="44" height="60"/>
    <rect x="465" y="315" width="62" height="25"/><rect x="530" y="262" width="40" height="78"/>
    <rect x="575" y="300" width="70" height="40"/><rect x="650" y="272" width="48" height="68"/>
    <rect x="700" y="308" width="100" height="32"/>
  </g>
  <g fill="#ffcf8a" opacity="0.5">
    <rect x="72" y="284" width="5" height="7"/><rect x="84" y="300" width="5" height="7"/>
    <rect x="228" y="310" width="6" height="8"/><rect x="242" y="322" width="6" height="8"/>
    <rect x="302" y="278" width="5" height="7"/><rect x="316" y="292" width="5" height="7"/>
    <rect x="424" y="296" width="6" height="8"/><rect x="588" y="314" width="6" height="8"/>
    <rect x="604" y="326" width="6" height="8"/><rect x="664" y="288" width="5" height="7"/>
  </g>

  <!-- signal gantry: legs, beam, lower chord, lattice -->
  <g fill="#101520">
    <rect x="118" y="148" width="17" height="240"/>
    <rect x="665" y="148" width="17" height="240"/>
    <rect x="118" y="148" width="564" height="15"/>
    <rect x="118" y="199" width="564" height="9"/>
  </g>
  <g stroke="#101520" stroke-width="5">
    <path d="M126 163 L152 198 L182 163 L212 198 L242 163 L272 198 L302 163 L332 198 L362 163 L392 198 L422 163 L452 198 L482 163 L512 198 L542 163 L572 198 L602 163 L632 198 L662 163"/>
    <path d="M126 320 L135 300 M135 300 L126 280"/>
    <path d="M674 320 L665 300 M665 300 L674 280"/>
  </g>
  <rect x="118" y="148" width="564" height="3" fill="#39445c"/>

  <!-- signal head A: green aspect (the near track, clear) -->
  <g>
    <rect x="222" y="163" width="7" height="14" fill="#101520"/>
    <rect x="206" y="177" width="39" height="106" rx="6" fill="#0a0e16" stroke="#2b3446" stroke-width="2"/>
    <circle cx="225.5" cy="200" r="11" fill="#3a1b1b"/>
    <circle cx="225.5" cy="230" r="11" fill="#3a3320"/>
    <circle cx="225.5" cy="260" r="11" fill="#34e27a"/>
    <circle cx="225.5" cy="260" r="30" fill="url(#glowGreen)"/>
    <rect x="212" y="186" width="27" height="1.5" fill="#000" opacity="0.5"/>
  </g>

  <!-- signal head B: red aspect (the far track, at danger) -->
  <g>
    <rect x="342" y="163" width="7" height="14" fill="#101520"/>
    <rect x="326" y="177" width="39" height="106" rx="6" fill="#0a0e16" stroke="#2b3446" stroke-width="2"/>
    <circle cx="345.5" cy="200" r="11" fill="#ff3b30"/>
    <circle cx="345.5" cy="230" r="11" fill="#3a3320"/>
    <circle cx="345.5" cy="260" r="11" fill="#14322a"/>
    <circle cx="345.5" cy="200" r="30" fill="url(#glowRed)"/>
    <rect x="332" y="186" width="27" height="1.5" fill="#000" opacity="0.5"/>
  </g>

  <!-- platform number sign on the gantry beam -->
  <g>
    <rect x="468" y="176" width="52" height="34" rx="3" fill="#0d121b" stroke="#2b3446" stroke-width="2"/>
    <text x="494" y="203" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#e6ecf7" text-anchor="middle">3</text>
  </g>

  <!-- platform lamps -->
  <g fill="#1b2130">
    <rect x="84" y="240" width="8" height="270"/>
    <rect x="84" y="240" width="30" height="7"/>
    <rect x="102" y="247" width="36" height="13" rx="4" fill="#232c3e"/>
    <rect x="708" y="240" width="8" height="270"/>
    <rect x="686" y="240" width="30" height="7"/>
    <rect x="662" y="247" width="36" height="13" rx="4" fill="#232c3e"/>
  </g>
  <circle cx="120" cy="256" r="7" fill="#ffe6bd"/>
  <circle cx="120" cy="256" r="70" fill="url(#lampGlow)"/>
  <circle cx="680" cy="256" r="7" fill="#ffe6bd"/>
  <circle cx="680" cy="256" r="70" fill="url(#lampGlow)"/>

  <!-- far platform, then the near track, then our platform edge -->
  <rect x="0" y="340" width="800" height="20" fill="#666b74"/>
  <rect x="0" y="360" width="800" height="12" fill="#23283a"/>
  <rect x="0" y="372" width="800" height="70" fill="#3a3a40"/>
  <g fill="#4b4b52">
    <circle cx="40" cy="386" r="3"/><circle cx="120" cy="394" r="2.5"/><circle cx="215" cy="382" r="3"/>
    <circle cx="300" cy="396" r="2.5"/><circle cx="390" cy="385" r="3"/><circle cx="470" cy="394" r="2.5"/>
    <circle cx="560" cy="381" r="3"/><circle cx="650" cy="395" r="2.5"/><circle cx="740" cy="387" r="3"/>
  </g>
  <g fill="#34302a">
    <rect x="4" y="408" width="12" height="34"/><rect x="50" y="408" width="12" height="34"/>
    <rect x="96" y="408" width="12" height="34"/><rect x="142" y="408" width="12" height="34"/>
    <rect x="188" y="408" width="12" height="34"/><rect x="234" y="408" width="12" height="34"/>
    <rect x="280" y="408" width="12" height="34"/><rect x="326" y="408" width="12" height="34"/>
    <rect x="372" y="408" width="12" height="34"/><rect x="418" y="408" width="12" height="34"/>
    <rect x="464" y="408" width="12" height="34"/><rect x="510" y="408" width="12" height="34"/>
    <rect x="556" y="408" width="12" height="34"/><rect x="602" y="408" width="12" height="34"/>
    <rect x="648" y="408" width="12" height="34"/><rect x="694" y="408" width="12" height="34"/>
    <rect x="740" y="408" width="12" height="34"/>
  </g>
  <rect x="0" y="414" width="800" height="2" fill="#dfe6ee"/>
  <rect x="0" y="416" width="800" height="3" fill="#8f98a3"/>
  <rect x="0" y="436" width="800" height="2" fill="#dfe6ee"/>
  <rect x="0" y="438" width="800" height="3" fill="#8f98a3"/>

  <!-- near platform: coping, safety line, surface, lamp pools -->
  <rect x="0" y="442" width="800" height="12" fill="#57534c"/>
  <rect x="0" y="454" width="800" height="11" fill="#e8c33c"/>
  <g fill="#b28f28" opacity="0.6">
    <rect x="8" y="457" width="7" height="5"/><rect x="34" y="457" width="7" height="5"/>
    <rect x="60" y="457" width="7" height="5"/><rect x="86" y="457" width="7" height="5"/>
    <rect x="112" y="457" width="7" height="5"/><rect x="138" y="457" width="7" height="5"/>
    <rect x="164" y="457" width="7" height="5"/><rect x="190" y="457" width="7" height="5"/>
    <rect x="216" y="457" width="7" height="5"/><rect x="242" y="457" width="7" height="5"/>
    <rect x="268" y="457" width="7" height="5"/><rect x="294" y="457" width="7" height="5"/>
    <rect x="320" y="457" width="7" height="5"/><rect x="346" y="457" width="7" height="5"/>
    <rect x="372" y="457" width="7" height="5"/><rect x="398" y="457" width="7" height="5"/>
    <rect x="424" y="457" width="7" height="5"/><rect x="450" y="457" width="7" height="5"/>
    <rect x="476" y="457" width="7" height="5"/><rect x="502" y="457" width="7" height="5"/>
    <rect x="528" y="457" width="7" height="5"/><rect x="554" y="457" width="7" height="5"/>
    <rect x="580" y="457" width="7" height="5"/><rect x="606" y="457" width="7" height="5"/>
    <rect x="632" y="457" width="7" height="5"/><rect x="658" y="457" width="7" height="5"/>
    <rect x="684" y="457" width="7" height="5"/><rect x="710" y="457" width="7" height="5"/>
    <rect x="736" y="457" width="7" height="5"/><rect x="762" y="457" width="7" height="5"/>
    <rect x="788" y="457" width="7" height="5"/>
  </g>
  <rect x="0" y="465" width="800" height="7" fill="#4c4842"/>
  <rect x="0" y="472" width="800" height="128" fill="#7a756c"/>
  <g opacity="0.5" fill="#8d877c">
    <rect x="0" y="472" width="800" height="2"/>
    <rect x="60" y="500" width="150" height="3"/><rect x="330" y="528" width="190" height="3"/>
    <rect x="120" y="562" width="230" height="3"/><rect x="500" y="486" width="140" height="3"/>
  </g>
  <ellipse cx="120" cy="520" rx="200" ry="70" fill="url(#pool)"/>
  <ellipse cx="680" cy="520" rx="200" ry="70" fill="url(#pool)"/>

  <!-- photographic finish: grain, then vignette -->
  <rect width="800" height="600" filter="url(#grain)" opacity="0.09" style="mix-blend-mode:overlay"/>
  <rect width="800" height="600" fill="url(#vignette)"/>
</svg>
