<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">Three release gates in a row</title>
  <desc id="d">Three labelled boxes connected left to right by arrows, reading build, test, and deploy. The middle box, test, is highlighted.</desc>
  <rect width="800" height="600" fill="#f8fafc"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="2">
      <rect x="48" y="228" width="196" height="144" rx="12"/>
      <rect x="302" y="228" width="196" height="144" rx="12"/>
      <rect x="556" y="228" width="196" height="144" rx="12"/>
    </g>
    <rect x="302" y="228" width="196" height="144" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round">
      <path d="M 250 300 L 292 300"/>
      <path d="M 504 300 L 546 300"/>
    </g>
    <g fill="#64748b">
      <path d="M 292 300 L 278 291 L 278 309 Z"/>
      <path d="M 546 300 L 532 291 L 532 309 Z"/>
    </g>
    <g text-anchor="middle" font-size="30" font-weight="600">
      <text x="146" y="296" fill="#334155">build</text>
      <text x="400" y="296" fill="#1d4ed8">test</text>
      <text x="654" y="296" fill="#334155">deploy</text>
    </g>
    <g text-anchor="middle" font-size="19" fill="#64748b">
      <text x="146" y="332">one commit</text>
      <text x="400" y="332">suite must pass</text>
      <text x="654" y="332">rollout</text>
    </g>
    <text x="400" y="140" text-anchor="middle" font-size="24" fill="#0f172a">A change crosses three gates before it ships</text>
    <text x="400" y="470" text-anchor="middle" font-size="19" fill="#64748b">Each gate can send the commit back to the start.</text>
  </g>
</svg>